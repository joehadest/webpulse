<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#030303" stop-opacity="0"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow-center" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-left" cx="20%" cy="60%" r="30%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="80%" cy="35%" r="25%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="700" fill="url(#glow-center)"/>
  <rect width="1200" height="700" fill="url(#glow-left)"/>
  <rect width="1200" height="700" fill="url(#glow-right)"/>

  <!-- Floating orbit rings -->
  <ellipse cx="600" cy="320" rx="280" ry="120" stroke="rgba(56,189,248,0.08)" stroke-width="1" transform="rotate(-8 600 320)"/>
  <ellipse cx="600" cy="320" rx="220" ry="90" stroke="rgba(56,189,248,0.12)" stroke-width="1" stroke-dasharray="6 10" transform="rotate(12 600 320)"/>

  <!-- Central browser mockup -->
  <g transform="translate(420, 180)" filter="url(#soft-glow)">
    <rect width="360" height="240" rx="16" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect width="360" height="36" rx="16" fill="rgba(255,255,255,0.04)"/>
    <rect y="20" width="360" height="16" fill="url(#card-grad)"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="38" cy="18" r="5" fill="#eab308" opacity="0.7"/>
    <circle cx="56" cy="18" r="5" fill="#22c55e" opacity="0.7"/>
    <rect x="80" y="10" width="200" height="16" rx="8" fill="rgba(255,255,255,0.06)"/>
    <!-- Code lines -->
    <rect x="24" y="56" width="120" height="8" rx="4" fill="rgba(56,189,248,0.5)"/>
    <rect x="24" y="76" width="200" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
    <rect x="24" y="92" width="160" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="24" y="108" width="180" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="24" y="124" width="100" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <!-- Pulse chart inside -->
    <path d="M24 190 L60 190 L80 150 L100 210 L120 170 L140 195 L200 195 L240 195 L260 160 L280 200 L300 175 L336 175"
      stroke="url(#line-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="80" cy="150" r="4" fill="#7dd3fc"/>
    <circle cx="100" cy="210" r="4" fill="#38bdf8"/>
    <circle cx="260" cy="160" r="4" fill="#7dd3fc"/>
  </g>

  <!-- Connection nodes -->
  <g opacity="0.7">
    <line x1="200" y1="280" x2="420" y2="260" stroke="rgba(56,189,248,0.2)" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="780" y1="260" x2="1000" y2="300" stroke="rgba(56,189,248,0.2)" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="150" y1="450" x2="420" y2="380" stroke="rgba(56,189,248,0.15)" stroke-width="1"/>
    <line x1="780" y1="380" x2="1050" y2="420" stroke="rgba(56,189,248,0.15)" stroke-width="1"/>
  </g>

  <!-- Left floating card -->
  <g transform="translate(120, 220)" opacity="0.85">
    <rect width="140" height="90" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="16" y="20" width="60" height="6" rx="3" fill="rgba(56,189,248,0.6)"/>
    <rect x="16" y="36" width="100" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
    <rect x="16" y="48" width="80" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
    <path d="M16 72 L40 72 L50 58 L60 82 L70 66 L80 72 L110 72" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Right floating card -->
  <g transform="translate(940, 200)" opacity="0.85">
    <rect width="140" height="90" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="70" cy="35" r="18" stroke="rgba(56,189,248,0.4)" stroke-width="2" fill="none"/>
    <path d="M58 35 L66 43 L84 25" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="30" y="62" width="80" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
    <rect x="40" y="72" width="60" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
  </g>

  <!-- Large pulse wave background -->
  <path d="M0 520 Q150 480 300 520 T600 520 T900 520 T1200 520"
    stroke="rgba(56,189,248,0.15)" stroke-width="2" fill="none"/>
  <path d="M0 560 Q200 520 400 560 T800 560 T1200 560"
    stroke="rgba(56,189,248,0.08)" stroke-width="1.5" fill="none"/>

  <!-- Decorative dots -->
  <circle cx="180" cy="150" r="3" fill="#38bdf8" opacity="0.5"/>
  <circle cx="1020" cy="180" r="4" fill="#7dd3fc" opacity="0.4"/>
  <circle cx="90" cy="380" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="1110" cy="350" r="3" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="600" cy="120" r="5" fill="#38bdf8" opacity="0.3"/>

  <!-- Bottom fade -->
  <rect width="1200" height="700" fill="url(#bg-grad)"/>
</svg>
