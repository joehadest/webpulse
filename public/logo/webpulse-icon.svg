<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="52" stroke="url(#ring-grad)" stroke-width="2" fill="rgba(56,189,248,0.06)"/>
  <circle cx="60" cy="60" r="38" stroke="rgba(56,189,248,0.12)" stroke-width="1" stroke-dasharray="4 6"/>
  <path
    d="M22 62 L38 62 L46 38 L54 82 L62 52 L70 72 L78 62 L98 62"
    stroke="url(#pulse-grad)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />
  <circle cx="46" cy="38" r="3" fill="#7dd3fc"/>
  <circle cx="54" cy="82" r="3" fill="#38bdf8"/>
  <circle cx="62" cy="52" r="3" fill="#7dd3fc"/>
</svg>
